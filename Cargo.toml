[package]
name = "titan-integration-template"
version = "0.1.0"
edition = "2024"

[features]
default = []
shadow = ["hylo-core/shadow", "hylo-idl/shadow", "hylo-quotes/shadow"]

[dependencies]
borsh = { version = "1.5.7", features = ["derive"] }
bytemuck = "1.25.2"
solana-client = "2.2.1"
solana-rpc-client = "2.2.1"
solana-pubkey = "2.2.1"
solana-program = "2.2.1"
solana-program-pack = "2.2.1"
solana-program-option = "2.2.1"
solana-sysvar = "2.2.1"
solana-sdk-ids = "2.2.1"
solana-account = "2.2.1"
solana-account-info = "2.2.1"
solana-instruction = "2.2.1"
solana-compute-budget = "2.2.1"
solana-transaction = "2.2.1"
solana-hash = "2.2.1"
solana-sdk = "2.2.1"
solana-instructions-sysvar = "2.2.1"
bincode = "1.3.3"
dashmap = "6.0.1"
ahash = "0.8.11"
async-trait = "0.1.80"
thiserror = "1.0.61"
tokio = { version = "1.38.0", features = ["full"] }
tokio-retry = "0.3.2"
log = "0.4.28"
env_logger = "0.11.3"
spl-token = { version = "7", features = ["no-entrypoint"] }
spl-token-2022 = { version = "^9", features = ["no-entrypoint"]}
spl-associated-token-account = "6"
litesvm =  { version = "^0.7.1"}
rand = "0.9.2"
assert_no_alloc = { version = "1.1.2", default-features = false }
anchor-lang = "0.32.1"
hylo-fix = "0.8.0"
hylo-core = { version = "2.3.9", features = ["offchain"] }
hylo-idl = "2.3.9"
hylo-quotes = "2.3.9"

# Used only for the construction allocation check. Normal tests, including
# `quoting_speed`, run under true `--release`.
[profile.release-debug]
inherits = "release"
debug-assertions = true
overflow-checks = false

[patch.crates-io]
hylo-clients = { git = "https://github.com/hylo-so/sdk", branch = "exo-registry" }
hylo-core = { git = "https://github.com/hylo-so/sdk", branch = "exo-registry" }
hylo-idl = { git = "https://github.com/hylo-so/sdk", branch = "exo-registry" }
hylo-quotes = { git = "https://github.com/hylo-so/sdk", branch = "exo-registry" }