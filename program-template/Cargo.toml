[workspace]
members = ["programs/*"]
resolver = "2"

[patch.crates-io]
hylo-core = { path = "../../sdk/hylo-core" }
hylo-idl = { path = "../../sdk/hylo-idl" }
hylo-quotes = { path = "../../sdk/hylo-quotes" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
