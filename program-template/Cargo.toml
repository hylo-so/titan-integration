[workspace]
members = ["programs/*"]
resolver = "2"

[patch.crates-io]
hylo-core = { git = "https://github.com/hylo-so/sdk", branch = "exo-registry" }
hylo-idl = { git = "https://github.com/hylo-so/sdk", branch = "exo-registry" }
hylo-quotes = { git = "https://github.com/hylo-so/sdk", branch = "exo-registry" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
