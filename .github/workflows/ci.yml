name: "Titan Integration CI"

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  check-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: "write"
      contents: "read"
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: DeterminateSystems/nix-installer-action@main
    - uses: DeterminateSystems/magic-nix-cache-action@v13
    - run: nix run .#check-version

  lint:
    needs: check-version
    if: |
      always() &&
      (github.event_name == 'push' || needs.check-version.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      id-token: "write"
      contents: "read"
    steps:
    - uses: actions/checkout@v5
    - uses: DeterminateSystems/nix-installer-action@main
    - uses: DeterminateSystems/magic-nix-cache-action@v13
    - run: nix run .#lint

  build-and-test:
    needs: check-version
    if: |
      always() &&
      (github.event_name == 'push' || needs.check-version.result == 'success')
    runs-on: ubuntu-latest-large
    permissions:
      id-token: "write"
      contents: "read"
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/github-script@v9
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL);
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);
    - uses: DeterminateSystems/nix-installer-action@main
    - uses: DeterminateSystems/magic-nix-cache-action@v13
    - uses: mozilla-actions/sccache-action@v0.0.10
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          . -> target
          program-template -> target

    - name: Check RPC secret
      run: |
        if [ -z "${SOLANA_RPC_URL}" ]; then
          echo "::error::SOLANA_RPC_URL secret missing"
          exit 1
        fi

    - run: nix run .#test-structure

    - run: nix run .#build-program

    - name: Venue suite
      run: nix run .#test-venue 2>&1 | tee venue.txt

    - name: Check venue phases
      run: |
        off=target/log-venue-off.txt
        prog=target/log-venue-prog.txt
        status=0
        if grep -q 'SKIP' "$off" "$prog"; then
          echo "::error::venue tests skipped"
          status=1
        fi
        if grep -qE '^  [A-Za-z].{0,30}  (red|FAILED) ' venue.txt; then
          echo "::error::venue suite failed"
          status=1
        fi
        if [ "$status" -ne 0 ]; then
          cat "$off" "$prog"
        fi
        exit "$status"

    - name: Upload phase logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: venue-logs
        path: |
          venue.txt
          target/log-*.txt
        if-no-files-found: ignore

  publish:
    needs: [lint, build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: "write"
      contents: "read"
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
    - uses: actions/checkout@v5
    - uses: DeterminateSystems/nix-installer-action@main
    - uses: DeterminateSystems/magic-nix-cache-action@v13
    - run: nix run .#publish
